<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="react-native-skia-chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231A52"/>
      <stop offset=".55" stop-color="#0E0B24"/>
      <stop offset="1" stop-color="#05050C"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".12" r=".7">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".95" cy=".9" r=".6">
      <stop offset="0" stop-color="#00E0C6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00E0C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset=".5" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#00E0C6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glowA)"/>
  <rect width="128" height="128" rx="30" fill="url(#glowB)"/>
  <!-- rising bars -->
  <rect x="24" y="74" width="18" height="30" rx="6" fill="url(#bars)"/>
  <rect x="55" y="60" width="18" height="44" rx="6" fill="url(#bars)"/>
  <rect x="86" y="44" width="18" height="60" rx="6" fill="url(#bars)"/>
  <!-- glowing trend line -->
  <path d="M20 82 C34 80 38 62 52 64 S70 72 80 56 S96 34 108 30" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round" opacity=".55" filter="url(#blur)"/>
  <path d="M20 82 C34 80 38 62 52 64 S70 72 80 56 S96 34 108 30" fill="none" stroke="url(#line)" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="108" cy="30" r="11" fill="#00E0C6" opacity=".25"/>
  <circle cx="108" cy="30" r="6" fill="#FFFFFF"/>
</svg>
